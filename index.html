<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Katia's Coin Club</title>
<meta name="description" content="A simple, fun allowance app — weekly chores, an extra-jobs board, a wallet, streaks and badges.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Coin Club">
<meta name="theme-color" content="#F3F2FB" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121020" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<script src="firebase-config.js"></script>
<style>
  :root{
    --grape:#7C5CFC; --grape-ink:#5B3FE0; --grape-soft:#EDE8FF;
    --gold:#FFB020; --gold-2:#FFC94D; --gold-soft:#FFF0CF;
    --mint:#22B37D; --mint-soft:#D6F3E7;
    --coral:#FF6B6B; --coral-soft:#FFE0E0;
    --bg:#F3F2FB; --card:#FFFFFF; --card-2:#F7F6FD;
    --ink:#211D33; --ink-soft:#726C8A; --line:#E7E3F3;
    --shadow:0 8px 24px rgba(45,32,90,.09);
    --font-round:ui-rounded,"SF Pro Rounded",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    --font-ui:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  }
  @media (prefers-color-scheme:dark){
    :root{
      --grape:#9B82FF; --grape-ink:#B7A4FF; --grape-soft:#2B2542;
      --gold:#FFC24D; --gold-2:#FFD780; --gold-soft:#3A311C;
      --mint:#3ED397; --mint-soft:#183a2e;
      --coral:#FF8080; --coral-soft:#3d2020;
      --bg:#121020; --card:#1F1C2E; --card-2:#191627;
      --ink:#ECEAF7; --ink-soft:#A29CBC; --line:#302B46;
      --shadow:0 10px 26px rgba(0,0,0,.45);
    }
  }
  :root[data-theme="light"]{
    --grape:#7C5CFC; --grape-ink:#5B3FE0; --grape-soft:#EDE8FF;
    --gold:#FFB020; --gold-2:#FFC94D; --gold-soft:#FFF0CF;
    --mint:#22B37D; --mint-soft:#D6F3E7; --coral:#FF6B6B; --coral-soft:#FFE0E0;
    --bg:#F3F2FB; --card:#FFFFFF; --card-2:#F7F6FD;
    --ink:#211D33; --ink-soft:#726C8A; --line:#E7E3F3; --shadow:0 8px 24px rgba(45,32,90,.09);
  }
  :root[data-theme="dark"]{
    --grape:#9B82FF; --grape-ink:#B7A4FF; --grape-soft:#2B2542;
    --gold:#FFC24D; --gold-2:#FFD780; --gold-soft:#3A311C;
    --mint:#3ED397; --mint-soft:#183a2e; --coral:#FF8080; --coral-soft:#3d2020;
    --bg:#121020; --card:#1F1C2E; --card-2:#191627;
    --ink:#ECEAF7; --ink-soft:#A29CBC; --line:#302B46; --shadow:0 10px 26px rgba(0,0,0,.45);
  }

  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
  html,body{margin:0}
  body{background:var(--bg);color:var(--ink);font-family:var(--font-ui);-webkit-font-smoothing:antialiased;overscroll-behavior:none;min-height:100vh}
  button{font-family:inherit;cursor:pointer;border:0;background:none;color:inherit}
  .num{font-variant-numeric:tabular-nums}

  .app{max-width:480px;margin:0 auto;min-height:100vh;padding:0 16px 108px;position:relative}

  header{position:sticky;top:0;z-index:20;background:var(--bg);padding:calc(14px + env(safe-area-inset-top)) 0 8px;display:flex;align-items:center;justify-content:space-between}
  .brand{display:flex;align-items:center;gap:10px}
  .coin{width:38px;height:38px;border-radius:50%;background:radial-gradient(circle at 35% 30%,var(--gold-2),var(--gold));display:grid;place-items:center;font-family:var(--font-round);font-weight:800;color:#7a4d00;font-size:18px;box-shadow:inset 0 0 0 3px rgba(255,255,255,.35),0 3px 8px rgba(180,120,0,.35)}
  .brand h1{font-family:var(--font-round);font-size:18px;margin:0;font-weight:800;letter-spacing:-.2px}
  .brand small{display:block;color:var(--ink-soft);font-size:11.5px;font-weight:600;margin-top:1px}
  .rolechip{display:flex;align-items:center;gap:7px;background:var(--card);border:1px solid var(--line);padding:7px 12px;border-radius:100px;font-weight:700;font-size:13px;box-shadow:var(--shadow)}
  .rolechip .dot{width:8px;height:8px;border-radius:50%;background:var(--grape)}
  .rolechip.parent .dot{background:var(--mint)}
  .rolechip .bell{background:var(--coral);color:#fff;border-radius:100px;font-size:11px;font-weight:800;padding:1px 6px;margin-left:2px}

  .card{background:var(--card);border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow)}
  .weekpill{display:inline-flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);color:var(--ink-soft);font-weight:700;font-size:12.5px;padding:7px 13px;border-radius:100px;margin:4px 0 14px}
  .weekpill b{color:var(--ink)}
  .weekpill .left{color:var(--coral)}

  .frozen{padding:14px 16px;margin:4px 0 14px;background:linear-gradient(160deg,var(--gold-soft),var(--card));border-color:var(--gold);font-weight:700;font-size:13px;line-height:1.45}
  .frozen b{font-family:var(--font-round)}

  .jarcard{padding:20px 20px 22px;text-align:center;margin-bottom:16px;position:relative;overflow:hidden}
  .jarcard.secured{background:linear-gradient(180deg,var(--mint-soft),var(--card))}
  .jarwrap{display:flex;align-items:center;justify-content:center;gap:18px}
  .jarcol{display:flex;flex-direction:column;align-items:center;gap:5px}
  .jar{width:112px;height:132px;flex:none}
  .sidestack{display:flex;align-items:center;gap:3px;font-size:16px;line-height:1;height:20px}
  .sidestack.has{animation:coinbob 2.6s ease-in-out infinite}
  .sidestack.none{opacity:0}
  .sidestack b{font-family:var(--font-round);color:var(--gold);font-size:14.5px;margin-left:3px}
  @keyframes coinbob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
  .sidelab{font-size:10px;font-weight:800;color:var(--ink-soft);letter-spacing:.6px;height:13px}
  .sidelab.none{opacity:0}
  .jarinfo{text-align:left}
  .jaramt{font-family:var(--font-round);font-weight:800;font-size:36px;line-height:1;letter-spacing:-1px}
  .jaramt small{font-size:19px;color:var(--ink-soft);font-weight:700}
  .jarstatus{margin-top:8px;font-weight:700;font-size:13.5px;color:var(--ink-soft);max-width:150px;line-height:1.4}
  .jarstatus.go{color:var(--mint)}
  .jarstatus .hi{color:var(--coral)}
  .secbadge{display:inline-flex;align-items:center;gap:6px;background:var(--mint);color:#fff;font-weight:800;font-size:13px;padding:6px 12px;border-radius:100px;margin-top:10px}

  .sectlabel{font-family:var(--font-round);font-weight:800;font-size:15px;margin:22px 4px 10px;display:flex;align-items:center;justify-content:space-between}
  .sectlabel .add{color:var(--grape);font-weight:800;font-size:13px;background:var(--grape-soft);padding:6px 12px;border-radius:100px}

  .chore{display:flex;flex-direction:column;gap:12px;padding:15px 16px;margin-bottom:11px}
  .chore.done{background:linear-gradient(180deg,var(--mint-soft),var(--card))}
  .chore .top{display:flex;align-items:center;gap:13px}
  .cico{width:46px;height:46px;flex:none;border-radius:14px;background:var(--card-2);display:grid;place-items:center;font-size:24px;border:1px solid var(--line);position:relative}
  .chore.done .cico{background:var(--mint-soft);border-color:transparent}
  .cico .camtag{position:absolute;right:-4px;bottom:-4px;font-size:12px;background:var(--card);border-radius:50%;width:19px;height:19px;display:grid;place-items:center;border:1px solid var(--line)}
  .cmeta{flex:1;min-width:0}
  .cmeta .name{font-family:var(--font-round);font-weight:800;font-size:15.5px}
  .cmeta .sub{color:var(--ink-soft);font-size:12.5px;font-weight:600;margin-top:2px}
  .cmeta .sub b{color:var(--mint)}
  .cmeta .sub .pend{color:var(--gold)}
  .cmeta .sub .val{color:var(--gold);font-weight:800}
  .cx{color:var(--ink-soft);font-size:20px;padding:2px 6px;opacity:.5}
  .checkmini{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;flex:none;border:2px solid var(--line);color:transparent;font-weight:900;font-size:14px}
  .chore.done .checkmini{background:var(--mint);border-color:var(--mint);color:#fff}

  .slots{display:flex;gap:7px;flex-wrap:wrap}
  .slots.stars{gap:9px}
  .slot{width:37px;height:44px;border-radius:12px;border:2px solid var(--line);background:var(--card-2);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-weight:800;font-size:11px;color:var(--ink-soft);position:relative;transition:transform .08s}
  .slot:active{transform:scale(.9)}
  .slot .mk{font-size:15px;line-height:1}
  .slot.pending{border-color:var(--gold);background:var(--gold-soft);color:var(--gold)}
  .slot.approved{border-color:var(--mint);background:var(--mint);color:#fff}
  .slot.today{box-shadow:0 0 0 3px var(--grape-soft)}
  .slot.star{width:44px;height:44px;font-size:20px}
  .slot.pop{animation:slotpop .32s ease}
  @keyframes slotpop{0%{transform:scale(1)}45%{transform:scale(1.3)}100%{transform:scale(1)}}
  .hint{font-size:11.5px;color:var(--ink-soft);font-weight:600;margin-top:2px}

  .cright{display:flex;align-items:center;gap:2px}
  .grip{color:var(--ink-soft);font-size:20px;padding:4px 8px;cursor:grab;opacity:.55;line-height:1;touch-action:none}
  body.dragging{user-select:none;-webkit-user-select:none;overflow:hidden}
  .chore.draghot{box-shadow:0 0 0 2px var(--grape),var(--shadow);opacity:.97}

  .job{display:flex;align-items:center;gap:13px;padding:13px 15px;margin-bottom:11px}
  .jico{width:44px;height:44px;flex:none;border-radius:13px;background:var(--card-2);display:grid;place-items:center;font-size:22px;border:1px solid var(--line)}
  .jmeta{flex:1;min-width:0}
  .jmeta .name{font-family:var(--font-round);font-weight:800;font-size:15px}
  .jmeta .st{font-size:12px;font-weight:700;margin-top:2px;color:var(--ink-soft)}
  .price{font-family:var(--font-round);font-weight:800;color:var(--gold);font-size:16px}
  .btn{border-radius:100px;font-weight:800;font-size:13px;padding:9px 15px;background:var(--grape);color:#fff;white-space:nowrap}
  .btn.ghost{background:var(--grape-soft);color:var(--grape-ink)}
  .btn.mint{background:var(--mint)}
  .btn.coral{background:var(--coral-soft);color:var(--coral)}
  .btn.wide{width:100%;padding:15px;font-size:15px;border-radius:16px}
  .btn.gold{background:linear-gradient(180deg,var(--gold-2),var(--gold));color:#6b4400}
  .btn:disabled{opacity:.45}
  .rowbtns{display:flex;gap:8px}

  .bigtotal{padding:22px;text-align:center;margin-bottom:14px;background:linear-gradient(160deg,var(--grape),var(--grape-ink));color:#fff;border:0}
  .bigtotal .lab{font-weight:700;opacity:.85;font-size:13px}
  .bigtotal .amt{font-family:var(--font-round);font-weight:800;font-size:46px;line-height:1.05;margin:4px 0}
  .bigtotal .brk{display:flex;justify-content:center;gap:18px;margin-top:6px;font-weight:700;font-size:13px;opacity:.95}
  .brkline{display:flex;justify-content:space-between;padding:12px 4px;border-bottom:1px solid var(--line);font-weight:700}
  .brkline:last-child{border:0}
  .brkline .v{font-family:var(--font-round);font-weight:800}
  .brkline .s{display:block;color:var(--ink-soft);font-size:11.5px;font-weight:600;margin-top:2px}
  .stat2{display:flex;gap:12px;margin:14px 0}
  .stat2 .card{flex:1;padding:16px;text-align:center}
  .stat2 .k{font-family:var(--font-round);font-weight:800;font-size:24px}
  .stat2 .l{color:var(--ink-soft);font-size:12px;font-weight:700;margin-top:2px}
  .hist{padding:4px 15px}
  .histrow{display:flex;align-items:center;justify-content:space-between;padding:13px 0;border-bottom:1px solid var(--line);font-weight:700;font-size:13.5px;gap:10px}
  .histrow:last-child{border:0}
  .histrow .d{color:var(--ink-soft);font-weight:600;font-size:12px;margin-top:3px}
  .histrow .amt{font-family:var(--font-round);font-weight:800;font-size:17px;white-space:nowrap}
  .tag{font-size:11px;font-weight:800;padding:3px 9px;border-radius:100px}
  .tag.perfect{background:var(--mint-soft);color:var(--mint)}
  .tag.part{background:var(--gold-soft);color:var(--gold)}

  .streakcard{padding:20px;text-align:center;margin-bottom:16px;background:linear-gradient(160deg,#FF9A3D,var(--coral));color:#fff;border:0}
  .streakcard .big{font-family:var(--font-round);font-weight:800;font-size:52px;line-height:1}
  .streakcard .l{font-weight:700;opacity:.95}
  .badges{display:grid;grid-template-columns:1fr 1fr;gap:11px}
  .badge{padding:16px 12px;text-align:center}
  .badge .em{font-size:32px;filter:grayscale(1);opacity:.32}
  .badge.on .em{filter:none;opacity:1}
  .badge .bn{font-family:var(--font-round);font-weight:800;font-size:13.5px;margin-top:6px}
  .badge .bd{color:var(--ink-soft);font-size:11.5px;font-weight:600;margin-top:2px;line-height:1.35}
  .badge.on{border-color:var(--gold);box-shadow:0 0 0 2px var(--gold-soft),var(--shadow)}

  .empty{text-align:center;color:var(--ink-soft);font-weight:600;font-size:13.5px;padding:26px 10px}

  nav{position:fixed;bottom:0;left:0;right:0;z-index:30;background:var(--card);border-top:1px solid var(--line);padding:8px 4px calc(8px + env(safe-area-inset-bottom));display:flex;max-width:480px;margin:0 auto}
  nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;color:var(--ink-soft);font-weight:700;font-size:10.5px;border-radius:14px}
  nav button .ni{font-size:20px;line-height:1}
  nav button.active{color:var(--grape)}
  nav button.active .ni{transform:translateY(-1px)}

  .scrim{position:fixed;inset:0;background:rgba(20,14,40,.5);z-index:40;display:none;align-items:flex-end;justify-content:center;backdrop-filter:blur(2px)}
  .scrim.on{display:flex}
  .sheet{background:var(--card);width:100%;max-width:480px;border-radius:26px 26px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom));box-shadow:0 -10px 40px rgba(0,0,0,.25);max-height:88vh;overflow-y:auto}
  .sheet h3{font-family:var(--font-round);font-weight:800;margin:2px 0 14px;font-size:19px}
  .csub{color:var(--ink-soft);font-weight:600;font-size:13.5px;margin:-8px 0 14px;line-height:1.5}
  .csub b{color:var(--ink)}
  .field{margin-bottom:12px}
  .field label{display:block;font-weight:700;font-size:12.5px;color:var(--ink-soft);margin-bottom:5px}
  .field input,.field select{width:100%;padding:13px 14px;border-radius:13px;border:1.5px solid var(--line);background:var(--card-2);color:var(--ink);font-size:16px;font-family:inherit;font-weight:600}
  .field input:focus,.field select:focus{outline:none;border-color:var(--grape)}
  .sheetbtns{display:flex;gap:10px;margin-top:8px}
  .sheetbtns.stack{flex-direction:column}

  .proof{width:100%;max-height:38vh;object-fit:contain;border-radius:16px;background:var(--card-2);border:1px solid var(--line);margin-bottom:14px;display:block}
  .shooting{text-align:center;padding:26px 10px;color:var(--ink-soft);font-weight:700;font-size:14px}

  /* icon picker */
  .iconhead{display:flex;gap:10px;align-items:center;margin-bottom:8px}
  .iconcur{width:48px;height:48px;flex:none;border-radius:12px;background:var(--card-2);border:1px solid var(--line);display:grid;place-items:center;font-size:26px}
  .iconsearch{flex:1;padding:12px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--card-2);color:var(--ink);font-size:16px;font-weight:600;font-family:inherit}
  .iconsearch:focus{outline:none;border-color:var(--grape)}
  .icongrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(40px,1fr));gap:6px;max-height:184px;overflow-y:auto;padding:6px;background:var(--card-2);border-radius:12px}
  .iconopt{height:40px;border-radius:10px;font-size:22px;background:transparent;border:1.5px solid transparent}
  .iconopt.sel{background:var(--grape-soft);border-color:var(--grape)}
  .iconnone{grid-column:1/-1;text-align:center;color:var(--ink-soft);font-weight:600;font-size:13px;padding:16px}

  /* toggle */
  .toggrow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 14px;background:var(--card-2);border:1.5px solid var(--line);border-radius:13px;margin-bottom:12px}
  .toggrow .tl{font-weight:700;font-size:13.5px}
  .toggrow .td{color:var(--ink-soft);font-weight:600;font-size:11.5px;margin-top:2px;line-height:1.35}
  .tog{width:52px;height:30px;border-radius:100px;background:var(--line);position:relative;flex:none;transition:background .16s}
  .tog:after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 2px 5px rgba(0,0,0,.25);transition:transform .16s}
  .tog.on{background:var(--mint)}
  .tog.on:after{transform:translateX(22px)}

  /* approvals + dashboard */
  .aprow{display:flex;align-items:center;gap:12px;padding:12px 2px;border-bottom:1px solid var(--line)}
  .aprow:last-child{border:0}
  .apico{width:38px;height:38px;flex:none;border-radius:11px;background:var(--card-2);display:grid;place-items:center;font-size:20px;border:1px solid var(--line);overflow:hidden}
  .apico img{width:100%;height:100%;object-fit:cover}
  .apmeta{flex:1;min-width:0}
  .apmeta .n{font-weight:800;font-size:14px}
  .apmeta .w{color:var(--ink-soft);font-size:12px;font-weight:600}
  .apok{background:var(--mint);color:#fff;border-radius:100px;font-weight:800;font-size:13px;padding:8px 14px;white-space:nowrap}
  .dashsec{font-family:var(--font-round);font-weight:800;font-size:13px;color:var(--ink-soft);margin:18px 2px 8px;letter-spacing:.3px;text-transform:uppercase}
  .dashsec:first-of-type{margin-top:6px}
  .dashbox{background:var(--card-2);border:1px solid var(--line);border-radius:16px;padding:6px 14px}
  .dashbox.pad{padding:14px}
  .dashnum{display:flex;gap:10px}
  .dashnum div{flex:1;background:var(--card-2);border:1px solid var(--line);border-radius:16px;padding:13px 8px;text-align:center}
  .dashnum .k{font-family:var(--font-round);font-weight:800;font-size:20px}
  .dashnum .l{color:var(--ink-soft);font-size:10.5px;font-weight:700;margin-top:2px}
  .allowrow{display:flex;gap:10px;align-items:flex-end}
  .allowrow .field{flex:1;margin-bottom:0}

  #cfx{position:fixed;inset:0;pointer-events:none;z-index:50}

  #pop{position:fixed;inset:0;z-index:60;display:none;align-items:center;justify-content:center;background:rgba(20,14,40,.55);backdrop-filter:blur(3px);padding:24px}
  #pop.on{display:flex;animation:fadein .2s ease}
  .popcard{background:var(--card);border-radius:28px;padding:30px 30px 28px;text-align:center;box-shadow:0 24px 70px rgba(0,0,0,.45);animation:popin .55s cubic-bezier(.2,1.35,.4,1);max-width:320px}
  .popcoin{font-size:66px;line-height:1;animation:spin .9s ease}
  .popbig{font-family:var(--font-round);font-weight:800;font-size:34px;color:var(--gold);margin-top:8px;letter-spacing:-.5px}
  .popsub{font-weight:700;color:var(--ink);margin-top:4px;font-size:15.5px}
  .poptap{color:var(--ink-soft);font-weight:600;font-size:12px;margin-top:14px}
  @keyframes popin{0%{transform:scale(.5) translateY(20px);opacity:0}100%{transform:scale(1) translateY(0);opacity:1}}
  @keyframes spin{0%{transform:rotateY(0) scale(.5)}100%{transform:rotateY(360deg) scale(1)}}
  @keyframes fadein{from{opacity:0}to{opacity:1}}

  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<div class="app" id="app"></div>
<nav id="nav"></nav>
<div class="scrim" id="scrim"><div class="sheet" id="sheet"></div></div>
<div id="pop"></div>
<canvas id="cfx"></canvas>

<script>
(function(){
  "use strict";

  /* ---------- local cache ---------- */
  var KEY  = "katia-coin-club-v3";
  var PKEY = "katia-coin-club-photos";   /* photos stay LOCAL — never synced (4KB ceiling) */

  function jarSVG(pct){

      '<defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1">'+

      '<clipPath id="jc"><rect x="20" y="22" width="80" height="100" rx="18"/></clipPath></defs>'+
      '<rect x="34" y="6" width="52" height="14" rx="7" fill="var(--line)"/>'+
      '<rect x="20" y="22" width="80" height="100" rx="18" fill="var(--card-2)" stroke="var(--line)" stroke-width="2"/>'+
      '<g clip-path="url(#jc)"><rect x="20" y="'+top+'" width="80" height="140" fill="url(#g)"/>'+coins+'</g>'+
      '<rect x="20" y="22" width="80" height="100" rx="18" fill="none" stroke="var(--line)" stroke-width="2"/>'+
      '<text x="60" y="'+(pct>.18?(118-96*pct):114)+'" text-anchor="middle" font-family="var(--font-round)" font-weight="800" font-size="20" fill="#6b4400" opacity="'+(pct>.12?.9:0)+'">$</text>'+

        ok:"Post it", tone:"mint", onOk:function(){ state.ach.en=1; setJob(jid,"open"); notify(state.child+", your idea got posted!", jo.name+" is live for "+money(jo.price)); }}); return; }

    if(a==="deljob"){ var jd=findJob(jid); if(!jd) return;

        ok:"Delete", tone:"coral", onOk:function(){ state.jobs=state.jobs.filter(function(x){return x.id!==jid;}); save(); render(); }}); return; }

    if(a==="addjob"){ jobSheet(); return; }

        ok:"Delete", tone:"coral", onOk:function(){ state.required=state.required.filter(function(c){return c.id!==cid;}); delete state.marks[cid]; save(); render(); }}); return; }

  function onSlot(cid,i){
    var c=findChore(cid); if(!c) return;
    var m=marksFor(c);

    if(role==="parent"){
      var isOn = m[i]===2;
      var when = c.layout==="week" ? DAYFULL[i] : "star "+(i+1);
      confirmAction({
        title: isOn ? "Undo this approval?" : "Approve "+esc(c.name)+"?",
        msg: isOn ? "Takes back <b>"+esc(when)+"</b> for <b>"+esc(c.name)+"</b> and removes "+money(choreValue(c)/c.need)+" from the jar."
                  : "<b>"+esc(when)+"</b> · worth <b>"+money(choreValue(c)/c.need)+"</b> toward this week.",
        ok: isOn ? "Undo it" : "Approve ✓", tone: isOn?"coral":"mint",
        img: PhotoStore.get("c:"+cid+":"+i),
        onOk:function(){
          var was=allSecured();
          m[i] = isOn ? 0 : 2;
          if(!isOn) PhotoStore.del("c:"+cid+":"+i);
          touchBadges(); save();
          if(!was && allSecured()) burst();

      return;

    if(c.photo===false){ confirmChoreDone(c,i,null,null); return; }

    openSheet('<h3>Show your work 📷</h3><div class="shooting">Opening the camera…</div>');
    takePhoto(function(res){

  /* ---------- camera ---------- */
  function takePhoto(cb){
    var inp=document.createElement("input");
    inp.type="file"; inp.accept="image/*";
    inp.setAttribute("capture","environment");   /* forces the camera, not the photo library */
    inp.style.cssText="position:fixed;left:-9999px;top:0;opacity:0";
    document.body.appendChild(inp);
    var done=false;
    inp.onchange=function(){
      if(done) return; done=true;
      var f=inp.files&&inp.files[0];
      try{ document.body.removeChild(inp); }catch(e){}
      if(!f){ cb(null); return; }
      shrink(f, cb);
    };
    /* if they back out of the camera, no change event ever fires — clean up on return */
    window.addEventListener("focus", function once(){
      window.removeEventListener("focus", once);
      setTimeout(function(){
        if(done) return;
        if(!(inp.files&&inp.files.length)){ done=true; try{ document.body.removeChild(inp); }catch(e){} cb(null); }
      }, 900);
    });
    inp.click();
  }
  function shrink(file, cb){
    var url=URL.createObjectURL(file), img=new Image();
    img.onload=function(){
      var max=720, sc=Math.min(1, max/Math.max(img.width,img.height));
      var cw=Math.max(1,Math.round(img.width*sc)), ch=Math.max(1,Math.round(img.height*sc));
      var cn=document.createElement("canvas"); cn.width=cw; cn.height=ch;
      cn.getContext("2d").drawImage(img,0,0,cw,ch);
      URL.revokeObjectURL(url);
      var dataUrl;
      try{ dataUrl=cn.toDataURL("image/jpeg",0.6); }catch(e){ dataUrl=null; }
      if(cn.toBlob){ cn.toBlob(function(b){ cb({url:dataUrl, blob:b||file}); }, "image/jpeg", 0.6); }

  /* ---------- drag to reorder chores (parent) ---------- */
  /* deliberately has no confirm — it's a continuous gesture, and a popup on every
     drop would make reordering unusable. Order isn't money, so nothing is at risk. */
  var dragId=null;
  function idxOf(id){ return state.required.findIndex(function(c){return c.id===id;}); }
  function markHot(){ if(!dragId) return; var c=document.querySelector('[data-cid="'+dragId+'"]'); if(c) c.classList.add("draghot"); }
  document.addEventListener("pointerdown", function(e){
    var g=e.target.closest("[data-grip]"); if(!g) return;
    dragId=g.getAttribute("data-grip"); document.body.classList.add("dragging"); markHot(); e.preventDefault();
  }, {passive:false});
  document.addEventListener("pointermove", function(e){
    if(!dragId) return; e.preventDefault();
    var el=document.elementFromPoint(e.clientX, e.clientY); var card=el&&el.closest("[data-cid]"); if(!card) return;
    var over=card.getAttribute("data-cid"); if(!over||over===dragId) return;
    var from=idxOf(dragId), to=idxOf(over); if(from<0||to<0) return;
    var moved=state.required.splice(from,1)[0]; state.required.splice(to,0,moved);
    render();
  }, {passive:false});
  function endDrag(){ if(!dragId) return; dragId=null; document.body.classList.remove("dragging"); save(); render(); }
  document.addEventListener("pointerup", endDrag);
  document.addEventListener("pointercancel", endDrag);

  /* ---------- coin sound + slot pop ---------- */
  var actx=null;
  function beepCoin(){
    if(state.sound===false) return;
    try{
      actx = actx || new (window.AudioContext||window.webkitAudioContext)();
      if(actx.state==="suspended") actx.resume();
      var t=actx.currentTime;
      [[988,0],[1319,0.09]].forEach(function(p){
        var o=actx.createOscillator(), g=actx.createGain();
        o.type="triangle"; o.frequency.value=p[0];
        g.gain.setValueAtTime(0.0001,t+p[1]);
        g.gain.exponentialRampToValueAtTime(0.28,t+p[1]+0.015);
        g.gain.exponentialRampToValueAtTime(0.0001,t+p[1]+0.2);
        o.connect(g); g.connect(actx.destination); o.start(t+p[1]); o.stop(t+p[1]+0.22);
      });
    }catch(e){}
  }

  /* ---------- confetti ---------- */
  var cv=document.getElementById("cfx"), ctx=cv.getContext("2d"), parts=[], raf=null;
  function size(){ cv.width=innerWidth; cv.height=innerHeight; } size(); addEventListener("resize",size);
  function burst(){
    if(matchMedia("(prefers-reduced-motion:reduce)").matches) return;
    var cols=["#7C5CFC","#FFB020","#22B37D","#FF6B6B","#FFC94D"];
    for(var i=0;i<90;i++) parts.push({x:innerWidth/2,y:innerHeight*0.35,
      vx:(Math.random()-.5)*11,vy:Math.random()*-12-3,g:.45,
      s:5+Math.random()*6,c:cols[i%cols.length],r:Math.random()*6,vr:(Math.random()-.5)*.4,life:0});
    if(!raf) raf=requestAnimationFrame(tick);
  }
  function tick(){
    ctx.clearRect(0,0,cv.width,cv.height); var alive=false;
    for(var i=0;i<parts.length;i++){ var p=parts[i]; if(p.life>140) continue; alive=true;
      p.life++; p.vy+=p.g; p.x+=p.vx; p.y+=p.vy; p.r+=p.vr;
      ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.r); ctx.globalAlpha=Math.max(0,1-p.life/140);
      ctx.fillStyle=p.c; ctx.fillRect(-p.s/2,-p.s/2,p.s,p.s*.6); ctx.restore(); }
    if(alive) raf=requestAnimationFrame(tick); else { raf=null; parts=[]; ctx.clearRect(0,0,cv.width,cv.height); }
  }

  /* ---------- boot ---------- */
  render();
  Sync.init(onRemote);
})();
</script>

if('serviceWorker' in navigator){
  addEventListener('load',function(){
    navigator.serviceWorker.register('sw.js').then(function(reg){ try{ reg.update(); }catch(e){} }).catch(function(){});
    if(navigator.serviceWorker.controller){
      var reloaded=false;
      navigator.serviceWorker.addEventListener('controllerchange', function(){ if(reloaded) return; reloaded=true; location.reload(); });
    }
  });
}
</script>
